databases:
  - name: glossio-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: glossio-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glossio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set after the frontend is deployed to Vercel and its URL is known
      # (comma-separated if you later add a custom domain alongside it).
      - key: CORS_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
