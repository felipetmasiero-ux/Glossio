    <!-- Preconnect + a real <link> (not Typography.css's old @import,
    which blocks the CSS itself from being discovered until after that
    first stylesheet downloads and parses) so the browser's preload
    scanner can start the font fetch immediately. -->
    <!-- impeccable-disable-next-line overused-font -- Operate-mode UI chrome (nav/buttons/labels) intentionally uses a workhorse sans; distinctiveness comes from the serif reading type + mono numbering system + notebook motifs, not from the interface font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap" />
