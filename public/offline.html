<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C3E63" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Glossio — Você está offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #EEF1F5;
        color: #1C1F26;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }

      .offline-card {
        max-width: 360px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .offline-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #2C3E63;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .offline-icon svg {
        width: 28px;
        height: 28px;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0;
      }

      p {
        margin: 0;
        color: #565F6B;
        font-size: 0.9375rem;
        line-height: 1.5;
      }

      button {
        margin-top: 8px;
        border: none;
        cursor: pointer;
        padding: 12px 24px;
        border-radius: 12px;
        background: #2C3E63;
        color: #FFFFFF;
        font-family: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
      }

      button:hover {
        background: #1F2D49;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <span class="offline-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5.5C12 4.67 11.33 4 10.5 4H5.5C4.67 4 4 4.67 4 5.5v13c0 .83.67 1.5 1.5 1.5H12"/>
          <path d="M12 5.5C12 4.67 12.67 4 13.5 4h5c.83 0 1.5.67 1.5 1.5v13c0 .83-.67 1.5-1.5 1.5H12"/>
          <path d="M12 5.5v14"/>
        </svg>
      </span>

      <h1>Você está offline.</h1>
      <p>Alguns recursos continuam disponíveis.</p>

      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
