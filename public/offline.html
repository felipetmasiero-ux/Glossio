<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C3E63" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Glossio — Você está offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #EEF1F5;
        color: #1C1F26;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }

      .offline-card {
        max-width: 360px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .offline-icon {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .offline-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0;
      }

      p {
        margin: 0;
        color: #565F6B;
        font-size: 0.9375rem;
        line-height: 1.5;
      }

      button {
        margin-top: 8px;
        border: none;
        cursor: pointer;
        padding: 12px 24px;
        border-radius: 12px;
        background: #2C3E63;
        color: #FFFFFF;
        font-family: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
      }

      button:hover {
        background: #1F2D49;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <span class="offline-icon">
        <img src="/favicon.png" alt="Glossio" />
      </span>

      <h1>Você está offline.</h1>
      <p>Alguns recursos continuam disponíveis.</p>

      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
